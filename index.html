<!doctype html>
<html lang="it" data-color-mode="light">

    <!-- Tema risolto prima del primo paint: senza questo, chi ha scelto il tema
         scuro vedrebbe un lampo bianco a ogni caricamento. Stessa logica di
         src/lib/theme.js, tenuta inline perché deve girare subito. -->
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('levelapp:color-mode')
          if (pref !== 'light' && pref !== 'dark' && pref !== 'auto') pref = 'auto'
          var resolved =
            pref === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref
          document.documentElement.dataset.colorMode = resolved
          document.documentElement.dataset.colorModePreference = pref
        } catch (e) {
          document.documentElement.dataset.colorMode = 'light'
        }
      })()
    </script>
